name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Lint WordPress bridge
        if: runner.os == 'Linux'
        run: php -l wordpress-plugin/wp-draft-publisher-bridge/wp-draft-publisher-bridge.php
