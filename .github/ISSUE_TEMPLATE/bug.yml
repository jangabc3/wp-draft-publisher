name: Bug report
description: Report a reproducible problem without sharing private site data.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Remove credentials, private URLs, prompts, and article contents before submitting.
  - type: input
    id: version
    attributes:
      label: Version
      description: Project version from the VERSION file or GitHub Release.
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: AI client
      options:
        - Codex
        - Claude Desktop or Claude Code
        - Cursor
        - Another MCP client
        - Direct PowerShell command
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows, Python, WordPress, PHP, and SEO plugin versions. Do not include a private site URL.
      placeholder: Windows 11, Python 3.13, WordPress 6.x, PHP 8.3, Rank Math
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use placeholder topics and URLs when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized error
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, private site URLs, prompts, and article contents.
          required: true
        - label: This report does not disclose a security vulnerability.
          required: true
