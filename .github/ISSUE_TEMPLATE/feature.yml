name: Feature request
description: Suggest a user-facing improvement.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the task that is difficult today.
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: Desired user scenario
      description: Give a concrete prompt and expected result.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and compatibility considerations
      description: Explain effects on draft-only behavior, WordPress permissions, clients, or SEO plugins.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: The proposal keeps final publishing under human control.
          required: true
