name: wpdp-integration

services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 40
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: ${WPDP_WORDPRESS_IMAGE:-wordpress:latest}
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') { $$_SERVER['HTTPS'] = 'on'; }
        define('WP_DEBUG_DISPLAY', false);
        define('WP_DEBUG_LOG', true);
        @ini_set('display_errors', 0);
        define('WP_HOME', 'https://localhost');
        define('WP_SITEURL', 'https://localhost');
    volumes:
      - wordpress_data:/var/www/html
      - ../wordpress-plugin/wp-draft-publisher-bridge:/var/www/html/wp-content/plugins/wp-draft-publisher-bridge:ro

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - wordpress
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.runtime/certs:/etc/nginx/certs:ro

  certgen:
    image: nginx:1.27-alpine
    profiles: ["setup"]
    volumes:
      - ./.runtime/certs:/certs
    command:
      - /bin/sh
      - -ec
      - |
        apk add --no-cache openssl >/dev/null
        openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 2 \
          -keyout /certs/localhost.key -out /certs/localhost.crt \
          -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
        chmod 644 /certs/localhost.crt /certs/localhost.key

  cli:
    image: ${WPDP_CLI_IMAGE:-wordpress:cli-2.12-php8.3}
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress_data:/var/www/html
      - ../wordpress-plugin/wp-draft-publisher-bridge:/var/www/html/wp-content/plugins/wp-draft-publisher-bridge:ro
    working_dir: /var/www/html

volumes:
  db_data:
  wordpress_data:
